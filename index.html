<body>

<main class="poster" id="poster">
  <div class="poster__bg" aria-hidden="true"></div>

  <div class="hud-corner hud-corner--bl"></div>

    <span class="poster__pub">BANDAI NAMCO ENTERTAINMENT</span>

  <!-- 中央主视觉 -->
  <section class="poster__center">
    <p class="poster__eyebrow">PROJECT ACES&ensp;×&ensp;UNREAL ENGINE 4</p>
    <h1 class="poster__title">ACE COMBAT 7</h1>

      <span>全球累计销量突破 250 万套 · 系列历史新高</span>
    </div>
    <div class="poster__scroll">

<script>
  // 全屏即入口：点击海报任意位置进入官网（按钮自身跳转除外）
  document.getElementById('poster').addEventListener('click', function () {
    location.href = 'SHOUYE.html';
  });
  // 滚轮 / 触摸滑动同样进入
  let wheelLock = false;
  window.addEventListener('wheel', function (e) {
    if (wheelLock || Math.abs(e.deltaY) < 12) return;
    wheelLock = true; location.href = 'SHOUYE.html';
  }, { passive: true });
</script>
